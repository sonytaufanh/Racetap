<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>RACETAP.ID - RESULT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
*{box-sizing:border-box;user-select:none}
@font-face {
  font-family: "HighSpeed";
  src: url("High Speed.otf") format("opentype");
  font-weight: bold;
}
@font-face {
  font-family: "font";
  src: url("eurosteal.big-caps-regular.ttf") format("truetype");
  font-weight: bold;
}
html,body{width:100%;height:100%;overflow:hidden}

body{
  margin:0;
  background:#000 no-repeat center center fixed;
  background-size:cover;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Arial Black",Arial,sans-serif;
}

.overlay{
  width:100vw;
  height:100vh;
  position:relative;
  display:none;
}

.text-layer{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  font-weight:bold;
  white-space:nowrap;
  line-height:1.05;
}

.allow-wrap{
  white-space:normal;
  overflow-wrap:break-word;
  word-break:normal;
}

/* Animasi kedap-kedip untuk teks standby */
@keyframes blink{
  0%,100%{ opacity:1; }
  50%{ opacity:0; }
}
.blink{
  animation: blink 1s step-start infinite;
}
</style>
</head>

<body>

<!-- Teks standby: tampil saat tidak ada data, tersembunyi saat overlay aktif -->
<div class="text-layer" id="standby" style="display:none"></div>

<div class="overlay" id="overlay">
  <div class="text-layer" id="status"></div>
  <!-- field text-layer lain dibuat otomatis lewat JS sesuai CONFIG.fields -->
</div>

<script>
/* ============================================================
   STATE
============================================================ */
let db = {};
let buffer = "";
let timerId = null;
let didFullscreen = false;
let CONFIG = {};
let fieldEls = {};      // { fieldKey: HTMLElement }
let wakeLock = null;

const overlayEl  = document.getElementById("overlay");
const statusEl   = document.getElementById("status");
const standbyEl  = document.getElementById("standby");

/* ============================================================
   DEFAULT CONFIG
   - "fields" bersifat dinamis: tambah/hapus field tanpa edit HTML.
   - "source" = nama kolom asal data (CSV header / key API).
============================================================ */
const DEFAULT_CONFIG = {
  eventName: "RACETAP.ID - RESULT",
  background: "bg.png",

  // "local" -> baca data.csv di folder yang sama
  // "api"   -> fetch dari apiUrl
  dataSource: "api",

  localFile: "data.csv",
  apiUrl: "https://time.feibot.com/api/scores-data/9OT5Z1UGD6",

  refreshInterval: 5000,
  resetTime: 40000,
  notFoundTime: 2500,

  enableFullscreen: true,
  enableWakeLock: true,
  uppercaseOnly: true,

  notFoundText: "DATA TIDAK DITEMUKAN",

  // Konversi kode gender jadi label lengkap. Set enabled:false untuk
  // tampilkan nilai mentah dari data apa adanya (tanpa konversi).
  genderMapping: {
    enabled: true,
    map: {
      "M": "Male",
      "F": "Female",
      "O": "Other"
    }
  },

  status: {
    top: "200px",
    left: "50%",
    width: "1000px",
    fontSize: "50px",
    color: "#ff0000",
    align: "center",
    wrap: false
  },

  // Field yang ditampilkan saat data ditemukan.
  // "source" harus cocok dengan nama kolom CSV ATAU key hasil mapping API.
  fields: {
    name: {
      source: "Name",
      enabled: true,
      top: "120px", left: "50%", width: "1400px",
      fontSize: "82px", color: "#ffffff", align: "center", wrap: true
    },
    bib: {
      source: "Bib",
      enabled: true,
      top: "550px", left: "240px", width: "700px",
      fontSize: "90px", color: "#107141", align: "center", wrap: false
    },
    item: {
      source: "Item",
      enabled: true,
      top: "550px", left: "1680px", width: "700px",
      fontSize: "90px", color: "#107141", align: "center", wrap: false
    },
    idCard: {
      source: "Id Card",
      enabled: true,
      top: "650px", left: "50%", width: "700px",
      fontSize: "60px", color: "#ffffff", align: "center", wrap: false
    },
    gender: {
      source: "Gender",
      enabled: false,
      top: "750px", left: "50%", width: "700px",
      fontSize: "60px", color: "#ffffff", align: "center", wrap: false
    },
    ageGroup: {
      source: "Age Group",
      enabled: false,
      top: "850px", left: "50%", width: "700px",
      fontSize: "60px", color: "#ffffff", align: "center", wrap: false
    },

    // Field statis (bukan dari data) yang muncul saat data DITEMUKAN.
    // Kosongkan "source" karena nilainya dari "staticText", bukan dari kolom data.
    // Contoh pakai: teks "Congratulations!" di mode BIB Result.
    congratulation: {
      source: "",
      staticText: "",
      enabled: false,
      top: "50px", left: "50%", width: "1400px",
      fontSize: "80px", color: "#FFD700", align: "center", wrap: false
    }
  },

  // Teks yang tampil saat layar standby (tidak ada yang tap).
  // Kecepatan kedip diatur lewat "blinkSpeed" dalam detik (default 1).
  standbyText: {
    enabled: true,
    text: "BIB RESULT",
    top: "50%", left: "50%", width: "1400px",
    fontSize: "120px", color: "#ffffff", align: "center",
    blinkSpeed: 1
  }
};

/* ============================================================
   UTIL
============================================================ */
function deepMerge(target, source){
  const output = {...target};
  for(const key in source){
    if(source[key] && typeof source[key] === "object" && !Array.isArray(source[key])){
      output[key] = deepMerge(target[key] || {}, source[key]);
    }else{
      output[key] = source[key];
    }
  }
  return output;
}

function cleanKey(v){
  const raw = String(v || "");
  if(!CONFIG.uppercaseOnly) return raw.trim();
  return raw.toUpperCase().match(/[0-9A-F]+/g)?.join("") || "";
}

function applyFieldStyle(el, style){
  if(!style) return;
  el.style.display   = style.enabled === false ? "none" : "block";
  el.style.top        = style.top || "0px";
  el.style.left       = style.left || "50%";
  el.style.width      = style.width || "1000px";
  el.style.fontSize   = style.fontSize || "80px";
  el.style.color      = style.color || "#ffffff";
  el.style.textAlign  = style.align || "center";
  el.style.textShadow = style.textShadow || "";
  el.style.fontFamily = style.fontFamily || "";
  el.style.fontStyle = style.fontStyle || "";
  el.style.transform  = "translateX(-50%)";
  el.classList.toggle("allow-wrap", !!style.wrap);
}

/* ============================================================
   BUILD FIELD ELEMENTS (dinamis sesuai CONFIG.fields)
============================================================ */
function buildFieldElements(){
  // bersihkan elemen field lama (selain status, yang statis di HTML)
  Object.values(fieldEls).forEach(el => el.remove());
  fieldEls = {};

  Object.keys(CONFIG.fields || {}).forEach(key => {
    const el = document.createElement("div");
    el.className = "text-layer";
    el.id = "field-" + key;
    overlayEl.appendChild(el);
    fieldEls[key] = el;
  });
}

function applyAllStyles(){
  applyFieldStyle(statusEl, CONFIG.status);
  Object.keys(CONFIG.fields || {}).forEach(key => {
    applyFieldStyle(fieldEls[key], CONFIG.fields[key]);
  });
  applyStandbyStyle();
}

function applyStandbyStyle(){
  const s = CONFIG.standbyText;
  if(!s) return;
  standbyEl.style.top       = s.top || "50%";
  standbyEl.style.left      = s.left || "50%";
  standbyEl.style.width     = s.width || "1400px";
  standbyEl.style.fontSize  = s.fontSize || "120px";
  standbyEl.style.color     = s.color || "#ffffff";
  standbyEl.style.textAlign = s.align || "center";
  standbyEl.style.transform = "translateX(-50%) translateY(-50%)";
  standbyEl.textContent     = s.text || "BIB RESULT";

  // Kecepatan kedip
  const speed = s.blinkSpeed || 1;
  standbyEl.style.animationDuration = speed + "s";
}

function showStandby(){
  const s = CONFIG.standbyText;
  if(!s || s.enabled === false){
    standbyEl.style.display = "none";
    return;
  }
  standbyEl.classList.add("blink");
  standbyEl.style.display = "block";
}

function hideStandby(){
  standbyEl.style.display = "none";
}

/* ============================================================
   CONFIG LOADING
============================================================ */
async function loadConfig(){
  try{
    const res = await fetch("setting-bibresult.json?ts=" + Date.now());
    if(!res.ok) throw new Error("setting-bibresult.json tidak ditemukan");
    const userConfig = await res.json();
    CONFIG = deepMerge(DEFAULT_CONFIG, userConfig);
  }catch(err){
    console.warn("SETTING ERROR:", err);
    CONFIG = DEFAULT_CONFIG;
  }

  document.title = CONFIG.eventName;
  document.body.style.backgroundImage = `url("${CONFIG.background}")`;

  buildFieldElements();
  applyAllStyles();
}

/* ============================================================
   CSV PARSER (auto-detect delimiter ; atau ,)
   - Sengaja sederhana (tanpa quoted-comma handling) sesuai
     kebutuhan saat ini: data hasil export timing system.
============================================================ */
function detectDelimiter(headerLine){
  const semi  = (headerLine.match(/;/g) || []).length;
  const comma = (headerLine.match(/,/g) || []).length;
  return semi >= comma ? ";" : ",";
}

function parseCSV(text){
  const lines = text.split(/\r\n|\n|\r/).filter(l => l.trim().length > 0);
  if(lines.length === 0) return [];

  const delim = detectDelimiter(lines[0]);
  const headers = lines[0].split(delim).map(h => h.trim());

  const rows = [];
  for(let i = 1; i < lines.length; i++){
    const cols = lines[i].split(delim);
    const row = {};
    headers.forEach((h, idx) => {
      row[h] = (cols[idx] !== undefined ? cols[idx] : "").trim();
    });
    rows.push(row);
  }
  return rows;
}

/* ============================================================
   DATA LOADING
   - Local (CSV) dan API dinormalisasi ke struktur record yang sama:
     record[fieldKey] = nilai kolom sesuai "source" di CONFIG.fields
   - chip & bib tetap dipakai sebagai index pencarian (selalu ada,
     terlepas dari field mana yang enabled untuk DITAMPILKAN).
============================================================ */

// Mapping kode gender (M/F/O) -> label lengkap.
// Aktif/nonaktif dan isi mapping diatur lewat CONFIG.genderMapping di JSON,
// TIDAK perlu edit baris ini. Default mapping (fallback) ada di DEFAULT_CONFIG.
function mapGenderValue(raw){
  const mapping = CONFIG.genderMapping;
  if(!mapping || mapping.enabled === false) return raw;

  const key = String(raw || "").trim().toUpperCase();
  const map = mapping.map || {};

  // Cocokkan persis (case-insensitive). Kalau tidak ada di map, tampilkan apa adanya.
  return map[key] !== undefined ? map[key] : raw;
}

function buildRecordFromRow(row, getValue){
  const record = {};
  Object.keys(CONFIG.fields || {}).forEach(key => {
    const fieldCfg = CONFIG.fields[key];

    // Field statis (congratulation, dll): pakai staticText, bukan kolom data
    if(fieldCfg.staticText !== undefined && !fieldCfg.source){
      record[key] = fieldCfg.staticText || "";
      return;
    }

    const src = fieldCfg.source;
    let value = getValue(row, src) || "";

    if(key === "gender"){
      value = mapGenderValue(value);
    }

    record[key] = value;
  });
  return record;
}

async function loadFromLocal(){
  const res = await fetch(CONFIG.localFile + "?ts=" + Date.now());
  if(!res.ok) throw new Error("File lokal tidak ditemukan: " + CONFIG.localFile);
  const text = await res.text();
  const rows = parseCSV(text);

  const newDb = {};
  rows.forEach(row => {
    const chipRaw = row["chip"] || row["Chip"] || "";
    const bibRaw  = row["Bib"] || row["BIB"] || row["bib"] || "";

    const record = buildRecordFromRow(row, (r, src) => r[src]);
    record._bib  = bibRaw;
    record._chip = chipRaw;

    const chipKey = cleanKey(chipRaw);
    const bibKey  = cleanKey(bibRaw);

    if(chipKey) newDb[chipKey] = record;
    if(bibKey)  newDb[bibKey]  = record;
  });

  return newDb;
}

async function loadFromApi(){
  const res = await fetch(CONFIG.apiUrl + "?ts=" + Date.now());
  if(!res.ok) throw new Error("API gagal dibaca");
  const data = await res.json();
  const scores = data.data || data.scores || [];

  // Mapping nama kolom API (snake_case lama) -> nama "source" gaya CSV,
  // supaya CONFIG.fields bisa dipakai bersama oleh kedua sumber data.
  const apiKeyMap = {
    "Item": "item_name",
    "Bib": "bib",
    "Name": "name",
    "Id Card": "id_card",
    "Gender": "sex",
    "Age Group": "age_group",
    "Gun Time": "total_score"
  };

  const newDb = {};
  scores.forEach(row => {
    const chipRaw = row.epc || "";
    const bibRaw  = row.bib || "";

    const record = buildRecordFromRow(row, (r, src) => {
      const apiKey = apiKeyMap[src] || src;
      return r[apiKey];
    });
    record._bib  = bibRaw;
    record._chip = chipRaw;

    const chipKey = cleanKey(chipRaw);
    const bibKey  = cleanKey(bibRaw);

    if(chipKey) newDb[chipKey] = record;
    if(bibKey)  newDb[bibKey]  = record;
  });

  return newDb;
}

async function loadData(){
  try{
    db = CONFIG.dataSource === "local"
      ? await loadFromLocal()
      : await loadFromApi();

    console.log("DATA LOADED (" + CONFIG.dataSource + "):", Object.keys(db).length, "keys");
  }catch(err){
    console.error("DATA LOAD ERROR:", err);
  }
}

/* ============================================================
   DISPLAY
============================================================ */
function clearTimer(){
  if(timerId){ clearTimeout(timerId); timerId = null; }
}

function resetDisplay(){
  overlayEl.style.display = "none";

  // KEMBALIKAN BACKGROUND STANDBY
  document.body.style.backgroundImage =
    `url("${CONFIG.background}")`;

  clearTimer();
  showStandby();
}

function showFound(record){
  hideStandby();

  // GANTI BACKGROUND SESUAI KATEGORI PESERTA
  setParticipantBackground(record);

  overlayEl.style.display = "block";

  Object.keys(fieldEls).forEach(key => {
    fieldEls[key].textContent = record[key] || "";
  });

  statusEl.textContent = "";

  clearTimer();
  timerId = setTimeout(resetDisplay, CONFIG.resetTime);
}

function showNotFound(message){
  hideStandby();
  overlayEl.style.display = "block";

  Object.keys(fieldEls).forEach(key => {
    fieldEls[key].textContent = "";
  });
  statusEl.textContent = message || CONFIG.notFoundText;

  clearTimer();
  timerId = setTimeout(resetDisplay, CONFIG.notFoundTime);
}

/* ============================================================
   FULLSCREEN & WAKE LOCK
============================================================ */
function goFullscreen(){
  if(!CONFIG.enableFullscreen || didFullscreen) return;
  try{
    document.documentElement.requestFullscreen?.();
    didFullscreen = true;
  }catch(e){}
}

async function keepAwake(){
  if(!CONFIG.enableWakeLock) return;
  try{
    if("wakeLock" in navigator){
      wakeLock = await navigator.wakeLock.request("screen");
    }
  }catch(e){}
}

document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible") keepAwake();
});

/* ============================================================
   INPUT (scanner mengetik BIB/chip lalu Enter)
============================================================ */
document.addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    goFullscreen();
    keepAwake();

    const key = cleanKey(buffer);
    buffer = "";
    if(!key) return;

    const rec = db[key];
    if(rec){
      showFound(rec);
    }else{
      showNotFound();
    }

  }else if(e.key.length === 1){
    buffer += e.key;
  }
});

/* ============================================================
   INIT
============================================================ */
(async function(){
  await loadConfig();
  showStandby();        // tampil standby DULU sebelum fetch data
  await loadData();     // fetch data di background
  keepAwake();

  setInterval(loadData, CONFIG.refreshInterval || 5000);
})();

/* ============================================================
   BACKGROUND
============================================================ */

function setParticipantBackground(record){
  const cfg = CONFIG.categoryBackground;

  if(!cfg || cfg.enabled === false){
    document.body.style.backgroundImage = `url("${CONFIG.background}")`;
    return;
  }

  const source = cfg.source || "Item";

  // cari field CONFIG.fields yang source-nya sesuai
  let categoryValue = "";

  Object.keys(CONFIG.fields || {}).forEach(key => {
    if(CONFIG.fields[key].source === source){
      categoryValue = record[key] || "";
    }
  });

  const bg = cfg.map?.[categoryValue];

  document.body.style.backgroundImage =
    `url("${bg || CONFIG.background}")`;
}

</script>

</body>
</html>
